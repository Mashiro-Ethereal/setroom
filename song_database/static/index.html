<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="app-token" content="__APP_TOKEN__">
  <title>乐队曲库 · Setroom</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/style.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <aside class="sidebar">
    <a class="brand" href="#upcoming"><span class="brand-icon">s.</span><span>SETROOM<small>乐队曲库</small></span></a>
    <div class="nav-caption">你的音乐工作间</div>
    <nav aria-label="主导航">
      <button data-view="upcoming"><span class="nav-symbol">▦</span>未来演出<span id="upcoming-count" class="nav-count">0</span></button>
      <button data-view="songs"><span class="nav-symbol">♫</span>曲库<span id="songs-count" class="nav-count">0</span></button>
      <button data-view="history"><span class="nav-symbol">◷</span>历史记录<span id="history-count" class="nav-count">0</span></button>
    </nav>
    <div class="sidebar-bottom">
      <div class="local-label"><span class="status-dot"></span>本地工作空间</div>
      <p>每一次排练，为下一次登台。</p>
      <button class="side-action" id="backup-open">备份与恢复 <span>↗</span></button>
      <button class="side-action" id="quit">退出应用 <span>⏻</span></button>
    </div>
  </aside>
  <main id="main">
    <div class="topbar"><span id="breadcrumb">工作空间 / 未来演出</span><span id="connection"><span class="status-dot"></span>已连接本机</span></div>
    <div id="content"><div class="loading">正在打开你的音乐工作间…</div></div>
  </main>
  <dialog id="editor" aria-labelledby="editor-title"><div id="editor-content"></div></dialog>
  <dialog id="confirm-dialog" aria-labelledby="confirm-title" aria-describedby="confirm-text">
    <form method="dialog" class="confirm-content">
      <h2 id="confirm-title"></h2><p id="confirm-text"></p>
      <div class="dialog-actions"><button value="cancel" class="button">返回</button><button value="ok" id="confirm-ok" class="button primary">确认</button></div>
    </form>
  </dialog>
  <div id="toast" role="status" aria-live="polite"></div>
</body>
</html>
